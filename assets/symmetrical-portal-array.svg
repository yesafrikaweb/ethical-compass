  <svg:style
     id="style13">
    .bg-rect { fill: url(#bgGrad); }
    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; stroke-dasharray: 4 8; }
    .bridge-line { stroke: rgba(255, 255, 255, 0.15); stroke-width: 2; fill: none; }
    .bridge-active { stroke: url(#circuitGrad); stroke-width: 3; fill: none; stroke-dasharray: 16 12; animation: bridgeDash 12s linear infinite; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6)); }
    .white-pulse { stroke: #ffffff; stroke-width: 2.5; fill: none; stroke-dasharray: 12 12; animation: bridgeDash 10s linear infinite; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)); }
    
    .portal-outer { stroke-width: 2; fill: none; }
    .portal-inner { stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    
    .portal-green { stroke: #10b981; filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4)); }
    .portal-gold { stroke: #f59e0b; filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.5)); }
    .portal-blue { stroke: #3b82f6; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4)); }

    .node-text-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: 0.05em; text-transform: uppercase; }
    .node-text-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    
    @keyframes bridgeDash {
      to { stroke-dashoffset: -320; }
    }
