<!DOCTYPE html>
<!-- Developed & Created by Gcwelethemba Tshuma -->
<html lang="en">
<head>
  <!-- Tag 0.20 -->
  <meta name="version" content="0.20">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090a">
  <link rel="icon" type="image/png" href="../avatar.png">
  <link rel="apple-touch-icon" href="../avatar.png">
  <link rel="manifest" href="../site.webmanifest">
    <meta name="author" content="Gcwelethemba Tshuma">
  <meta name="copyright" content="Gcwelethemba Tshuma">
  <meta property="og:author" content="Gcwelethemba Tshuma">
  <title>Ethical Compass - Chart Scaling Test Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-midnight: #0b0f19;
      --color-deep-blue: #111827;
      --color-electric-blue: #3b82f6;
      --color-text: #f3f4f6;
      --color-text-muted: #9ca3af;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-success: #10b981;
      --color-failure: #ef4444;
      --radius-md: 8px;
    }

    body {
      background-color: var(--color-midnight);
      color: var(--color-text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--color-text-muted);
      margin: 0.5rem 0 0 0;
      font-size: 0.95rem;
    }

    .summary-card {
      background-color: var(--color-deep-blue);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .summary-stat {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
    }

    .stat-val {
      font-size: 2rem;
      font-weight: 700;
    }

    .stat-val.passed { color: var(--color-success); }
    .stat-val.failed { color: var(--color-failure); }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .test-card {
      background-color: var(--color-deep-blue);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .test-header {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      user-select: none;
    }

    .test-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .test-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .test-badge.pass {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--color-success);
    }

    .test-badge.fail {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--color-failure);
    }

    .test-details {
      padding: 1rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background-color: rgba(0, 0, 0, 0.15);
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .assertion-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bullet-success { color: var(--color-success); }
    .bullet-failure { color: var(--color-failure); }

    .action-bar {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    .btn {
      background-color: var(--color-electric-blue);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Ethical Compass Test Suite</h1>
      <p class="subtitle">Verifying Line Chart scaling, path interpolation, and dynamic layouts</p>
    </header>

    <section class="summary-card">
      <div class="summary-stat">
        <span class="stat-label">Total Tests</span>
        <span class="stat-val" id="total-tests">0</span>
      </div>
      <div class="summary-stat">
        <span class="stat-label">Passed</span>
        <span class="stat-val passed" id="passed-tests">0</span>
      </div>
      <div class="summary-stat">
        <span class="stat-label">Failed</span>
        <span class="stat-val failed" id="failed-tests">0</span>
      </div>
    </section>

    <section class="test-list" id="test-results"></section>

    <div class="action-bar">
      <button class="btn" onclick="runTests()">Re-run Tests</button>
      <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>

  <script>
    // System logic being tested (re-defined here to verify math unit correctness)
    function scalePathD(originalD, factor) {
      return originalD.split(' ').map(token => {
        if (token.includes(',')) {
          const [xStr, yStr] = token.split(',');
          const x = parseFloat(xStr);
          if (!isNaN(x)) {
            return `${(x * factor).toFixed(1)},${yStr}`;
          }
        }
        return token;
      }).join(' ');
    }

    // Testing framework
    const testCases = [];
    function test(name, fn) {
      testCases.push({ name, fn });
    }

    let assertPassed = true;
    let assertionsLog = [];

    function assert(condition, message) {
      if (!condition) {
        assertPassed = false;
        assertionsLog.push(`❌ FAIL: ${message}`);
      } else {
        assertionsLog.push(`✅ PASS: ${message}`);
      }
    }

    function assertEquals(actual, expected, message) {
      if (actual !== expected) {
        assertPassed = false;
        assertionsLog.push(`❌ FAIL: ${message} (Expected: "${expected}", Actual: "${actual}")`);
      } else {
        assertionsLog.push(`✅ PASS: ${message} (Value: "${actual}")`);
      }
    }

    // Define Unit Tests
    test("Path Scaling - Factor 1.0 (Identity)", () => {
      const originalPath = "M 45,100 Q 146,220 247,150";
      const result = scalePathD(originalPath, 1.0);
      assertEquals(result, "M 45.0,100 Q 146.0,220 247.0,150", "Path scaling at factor 1.0 matches source format with 1 decimal place");
    });

    test("Path Scaling - Factor 1.5", () => {
      const originalPath = "M 40,100 T 80,200";
      const result = scalePathD(originalPath, 1.5);
      assertEquals(result, "M 60.0,100 T 120.0,200", "Path coordinates are correctly multiplied by 1.5");
    });

    test("Path Scaling - Factor 0.5", () => {
      const originalPath = "M 100,50 Q 200,300 400,150";
      const result = scalePathD(originalPath, 0.5);
      assertEquals(result, "M 50.0,50 Q 100.0,300 200.0,150", "Path coordinates are correctly halved");
    });

    test("Path Scaling - Edge Case (Negative and Floating Coordinates)", () => {
      const originalPath = "M -10,50.5 T -20.5,100";
      const result = scalePathD(originalPath, 2);
      assertEquals(result, "M -20.0,50.5 T -41.0,100", "Supports negative numbers and correctly scales coordinates");
    });

    test("Math Scaling Verification for Lines and Circles", () => {
      const origX = 80;
      const factor = 1.25;
      const scaledX = (origX * factor).toFixed(1);
      assertEquals(scaledX, "100.0", "Lines and circle X coordinates scale correctly at 1.25x");
    });

    // Run tests and render output
    function runTests() {
      const resultsContainer = document.getElementById('test-results');
      resultsContainer.innerHTML = '';
      
      let passedCount = 0;
      let failedCount = 0;

      testCases.forEach(tc => {
        assertPassed = true;
        assertionsLog = [];
        
        try {
          tc.fn();
        } catch (err) {
          assertPassed = false;
          assertionsLog.push(`❌ ERROR: Exception thrown during execution: ${err.message}`);
        }

        const status = assertPassed ? "pass" : "fail";
        if (assertPassed) passedCount++; else failedCount++;

        // Render card
        const card = document.createElement('div');
        card.className = 'test-card';
        
        const header = document.createElement('div');
        header.className = 'test-header';
        header.innerHTML = `
          <span class="test-name">${tc.name}</span>
          <span class="test-badge ${status}">${status}</span>
        `;

        const details = document.createElement('div');
        details.className = 'test-details';
        assertionsLog.forEach(log => {
          const line = document.createElement('div');
          line.className = 'assertion-line';
          line.innerHTML = log;
          details.appendChild(line);
        });

        card.appendChild(header);
        card.appendChild(details);
        resultsContainer.appendChild(card);
      });

      document.getElementById('total-tests').innerText = testCases.length;
      document.getElementById('passed-tests').innerText = passedCount;
      document.getElementById('failed-tests').innerText = failedCount;
    }

    // Auto-run on page load
    window.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
